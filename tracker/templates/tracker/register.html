<!DOCTYPE html>
<html>
<head>
    <title>Create Your Workspace</title>
</head>
<body>
    <h1>Sign Up & Create Workspace</h1>
    
    <form method="POST">
        <!-- This token is required by Django to prevent cross-site request forgery -->
        {% csrf_token %}
        
        <!-- This renders the username and password fields -->
        {{ form.as_p }}
        
        <!-- This is our custom field that the Python view is looking for -->
        <p>
            <label for="workspace_name">Workspace Name:</label>
            <input type="text" name="workspace_name" id="workspace_name" required>
        </p>
        
        <button type="submit">Create Account</button>
    </form>
    
    <br>
    <a href="/login/">Already have an account? Log in here.</a>
</body>
</html>
